name: Build SaoqiangWCAssets

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Theos + iPhoneOS16.5 SDK + ldid + GNU make，并导出 $THEOS
      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.6

      # make package 生成 .deb 需要 dpkg-deb
      - name: Install dpkg
        run: brew install dpkg

      # FINALPACKAGE=1 产出 release 版（去调试符号），适合注入
      - name: Build tweak
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p artifacts
          # 裸 dylib（TrollStore 注入用）
          find .theos/obj -type f -name '*.dylib' -exec cp {} artifacts/ \; || true
          # deb 安装包（越狱环境备用）
          find packages -type f -name '*.deb' -exec cp {} artifacts/ \; || true
          echo '--- artifacts ---'
          ls -lh artifacts
          # 至少要有 dylib，否则视为构建失败
          if ! ls artifacts/*.dylib >/dev/null 2>&1; then
            echo "::error::未找到编译产物 dylib"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaoqiangWCAssets-build
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
